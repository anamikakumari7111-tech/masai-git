<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes with localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }
        textarea {
            width: 100%;
            height: 200px;
            resize: vertical;
        }
        button {
            margin: 5px 5px 5px 0;
        }
    </style>
</head>
<body>

    <h2>My Notes</h2>

    <textarea id="notesArea" placeholder="Write your notes here..."></textarea>
    <br>

    <button id="saveBtn">Save Notes</button>
    <button id="loadBtn">Load Notes</button>
    <button id="clearBtn">Clear Notes</button>

    <script>
        const notesArea = document.getElementById("notesArea");
        const saveBtn = document.getElementById("saveBtn");
        const loadBtn = document.getElementById("loadBtn");
        const clearBtn = document.getElementById("clearBtn");

        // Load notes automatically on page load
        document.addEventListener("DOMContentLoaded", () => {
            const savedNotes = localStorage.getItem("userNotes");
            if (savedNotes) {
                notesArea.value = savedNotes;
            }
        });

        // Save notes
        saveBtn.addEventListener("click", () => {
            const notes = notesArea.value.trim();
            if (notes === "") {
                alert("Cannot save empty notes!");
                return;
            }
            localStorage.setItem("userNotes", notes);
            alert("Notes saved!");
        });

        // Load notes manually
        loadBtn.addEventListener("click", () => {
            const savedNotes = localStorage.getItem("userNotes");
            if (savedNotes) {
                notesArea.value = savedNotes;
                alert("Notes loaded!");
            } else {
                alert("No saved notes found.");
            }
        });

        // Clear notes
        clearBtn.addEventListener("click", () => {
            localStorage.removeItem("userNotes");
            notesArea.value = "";
            alert("Notes cleared!");
        });
    </script>

</body>
</html>
